[package]
name = "ely-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
ely-gpui-component.workspace = true
ely-platform.workspace = true
gpui.workspace = true
directories.workspace = true
futures.workspace = true
semver.workspace = true
log.workspace = true
notify.workspace = true
serde_json.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
ely-gpui-component = { workspace = true, features = ["runtime_shaders"] }
gpui_platform.workspace = true

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
gpui_mobile.workspace = true

# gpui-mobile's iOS views call these two packages unconditionally.
[target.'cfg(target_os = "ios")'.dependencies]
gpui_mobile = { workspace = true, features = ["video_player", "camera"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { package = "gpui-pre-windows", version = "=0.3.10" }

[features]
frames = ["gpui/profiler"]
test-support = []

[dev-dependencies]
ely-gpui-component = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys.workspace = true

[lints]
workspace = true

[[test]]
name = "startup_panic"
harness = false
