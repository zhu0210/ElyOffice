# Phones, on the mobile branch only: desktop checks, Android, iOS.
name: mobile
on:
  push:
    branches: [mobile]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
jobs:
  desktop:
    uses: ./.github/workflows/pr.yml

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Room for two debug targets
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2
      - name: APK for phones (arm64) and the emulator (x86_64)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ELY_ABI=arm64-v8a mobile/android/build.sh
          ELY_ABI=x86_64 ELY_RELEASE=1 mobile/android/build.sh
      - name: Disk back for the emulator
        run: rm -rf target mobile/android/app/build/intermediates && df -h /
      - uses: actions/upload-artifact@v7
        with:
          name: ElyMark-debug.apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: ElyMark on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash mobile/android/smoke.sh
      - name: Screenshot and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-smoke
          path: smoke/
          retention-days: 14

  ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode project
        run: brew install xcodegen && (cd mobile/ios && xcodegen generate --spec project.yml)
      - name: Simulator build
        run: |
          ELY_SIM=1 mobile/ios/build.sh
          cd mobile/ios && xcodebuild -project ElyMark.xcodeproj -scheme ElyMark \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: ElyMark on the simulator
        run: |
          set -uo pipefail
          mkdir -p smoke
          sim=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          xcrun simctl boot "$sim" && xcrun simctl bootstatus "$sim" -b
          xcrun simctl install "$sim" mobile/ios/build/Build/Products/Debug-iphonesimulator/ElyMark.app
          xcrun simctl launch "$sim" com.elyoffice.mark
          sleep 30
          xcrun simctl io "$sim" screenshot smoke/screenshot.png
          xcrun simctl spawn "$sim" log show --last 3m --style compact --predicate 'process == "ElyMark"' > smoke/log.txt || true
          # Captured first: grep -q's early exit fails pipefail.
          services=$(xcrun simctl spawn "$sim" launchctl list)
          grep -q com.elyoffice.mark <<<"$services" || { echo "::error::ElyMark is not running"; tail -40 smoke/log.txt; exit 1; }
      - name: Screenshot and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-smoke
          path: smoke/
          retention-days: 14
      - name: Unsigned IPA for devices
        run: |
          rm -rf target/aarch64-apple-ios-sim
          ELY_RELEASE=1 mobile/ios/build.sh
          cd mobile/ios && xcodebuild -project ElyMark.xcodeproj -scheme ElyMark \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p ipa/Payload && cp -R build/Build/Products/Release-iphoneos/ElyMark.app ipa/Payload/
          (cd ipa && zip -qr ElyMark-unsigned.ipa Payload)
      # SideStore signs it on the device.
      - uses: actions/upload-artifact@v7
        with:
          name: ElyMark-unsigned.ipa
          path: mobile/ios/ipa/ElyMark-unsigned.ipa
          retention-days: 14
